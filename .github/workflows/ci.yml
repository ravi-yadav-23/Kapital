name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-api:
    name: Test FastAPI Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kapitl_test
          POSTGRES_USER: kapitl
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run API test suite
        working-directory: apps/api
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://kapitl:password@localhost:5432/kapitl_test
          # enables the Postgres-only migration/init tests (each test creates and drops its own database)
          MIGRATION_TEST_DATABASE_URL: postgresql://kapitl:password@localhost:5432/kapitl_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-used-in-prod
        run: pytest tests/

  test-web:
    name: Build Next.js & Web Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run web unit tests
        run: pnpm --filter @kapitl/web test

      - name: Build web application and packages
        run: pnpm build
