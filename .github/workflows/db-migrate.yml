name: Database migrate

# Applies (or rehearses) `alembic upgrade head` against the production database.
# Repository secret required: DATABASE_URL  (use the Supabase *session pooler* URL, port 5432; the direct
# db.<ref>.supabase.co host is IPv6-only and GitHub runners cannot reach it).
#
# Always run mode=dry-run first: it applies everything inside one transaction, compares the result with the
# models and ROLLS BACK, so nothing changes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (no changes) or apply"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Dry run
        if: ${{ inputs.mode == 'dry-run' }}
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/db_dry_run.py
      - name: Apply migrations
        if: ${{ inputs.mode == 'apply' }}
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
