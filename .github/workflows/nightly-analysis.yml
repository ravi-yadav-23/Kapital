name: Nightly IPO analysis

# Syncs IPO sources and analyses offer documents (open IPOs first) with the free Groq tier.
# Runs inside GitHub Actions - not on Vercel - so it can take minutes; finished chunks are saved as it goes
# and a rate limit simply stops the run until tomorrow.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL        Supabase *session* pooler URL (port 5432), e.g. postgresql+asyncpg://...
#   GROQ_API_KEY        Groq free-tier key
#   IPOALERTS_API_KEY   ipoalerts key (optional; the other sources work without it)
#   GEMINI_API_KEY      Google Gemini key (optional): backup model when Groq's limit is reached, and the
#                       last-resort web search for IPOs with no readable offer document
#
# 20:30 UTC = 02:00 IST. GitHub schedules are best-effort and may start a few minutes late.

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      max_chunks:
        description: "Chunk budget for this run (default 60)"
        required: false
        default: "60"
      max_ipos:
        description: "Maximum IPOs to analyse (default 15)"
        required: false
        default: "15"
      max_tokens:
        description: "Model token budget for this run (default 150000)"
        required: false
        default: "150000"

permissions:
  contents: read

concurrency:
  group: kapitl-nightly-analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run nightly analysis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IPOALERTS_API_KEY: ${{ secrets.IPOALERTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_IPOALERTS_ENABLED: "true"
          NIGHTLY_MAX_CHUNKS: ${{ inputs.max_chunks }}
          NIGHTLY_MAX_IPOS: ${{ inputs.max_ipos }}
          NIGHTLY_MAX_TOKENS: ${{ inputs.max_tokens }}
        run: python -m app.jobs.nightly
