version: "3.9"

services:
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app
    env_file:
      - ../../apps/api/.env
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ../../apps/api
    volumes:
      - ../../apps/api:/app
    env_file:
      - ../../apps/api/.env
    depends_on:
      - redis
      - postgres
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ../../apps/api
    volumes:
      - ../../apps/api:/app
    env_file:
      - ../../apps/api/.env
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antigravity
      POSTGRES_USER: antigravity
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
