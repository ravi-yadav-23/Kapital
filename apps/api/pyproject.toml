[project]
name = "kapitl-api"
version = "0.1.0"
description = "Kapitl API service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.0.3",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "flower>=2.0.1",
    "apscheduler>=3.10.4",
    "anthropic>=0.37.0",
    "google-generativeai>=0.8.0",
    "groq>=0.9.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyotp>=2.9.0",
    "scipy>=1.14.0",
    "pulp>=2.9.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "qrcode>=7.4.2",
    "pillow>=10.4.0",
    "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
